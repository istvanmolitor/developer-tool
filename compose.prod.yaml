# Production-ish compose for the test VPS (molitoristvan.dunahousedev.com).
# Same custom PHP 8.5 image as compose.yaml, but WITHOUT Elasticsearch
# (SEARCH_DRIVER=collection) and without the Vite dev port. The app container's
# supervisord already runs php serve + scheduler + queue worker.
#
# TLS is terminated by the `caddy` service, which owns host ports 80/443 and
# reverse-proxies to laravel.test:80 (so the app container is NOT published on
# the host). Caddy serves a self-signed cert via `tls internal`, which is what
# Cloudflare's "Full" SSL mode expects on the origin. The app is reached only
# through Cloudflare -> Caddy (https), so X-Forwarded-Proto=https reaches
# Laravel and APP_URL=https URLs are generated correctly.
services:
    laravel.test:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.5/app'
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
            - '${DEVELOPER_TOOL_PROJECTS_HOST_PATH:-../projects}:/projects'
            - '${HOME}/.claude:/home/sail/.claude'
            - '${HOME}/.claude.json:/home/sail/.claude.json'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
    caddy:
        image: 'caddy:2-alpine'
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - './docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro'
            - 'caddy-data:/data'
            - 'caddy-config:/config'
        networks:
            - sail
        depends_on:
            - laravel.test
    mysql:
        image: 'mysql:8.4'
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'prod-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        restart: unless-stopped
        volumes:
            - 'prod-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    prod-mysql:
        driver: local
    prod-redis:
        driver: local
    caddy-data:
        driver: local
    caddy-config:
        driver: local
